<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | InspiGraphie</title>
  <style>
    @font-face {
        font-family: "DonGraffiti";
        src: url("fonts/DonGraffiti.otf") format("opentype"),
             url("fonts/DonGraffiti.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }

    /* ===== STYLE GLOBAL & FOND ===== */
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background-image: url("images/fond.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== HEADER GLASS (Sticky & Responsive) ===== */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 40px;
      position: sticky; 
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(17, 17, 17, 0.8);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .header-left img { width: 100px; height: auto; object-fit: contain; }

    .header-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .logo-typo {
      font-size: 3rem;
      color: white;
      font-family: "DonGraffiti", sans-serif;
    }

    /* Navigation Desktop */
    .nav { display: flex; gap: 20px; }

    .nav a {
      text-decoration: none;
      color: white;
      opacity: 0.5;
      font-size: 1.2rem;
      transition: 0.3s;
      position: relative;
    }

    .nav a:hover, .nav a.active { opacity: 1; }

    .nav a.active::after {
      content: "";
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 100%;
      height: 2px;
      background: white;
      border-radius: 2px;
    }

    /* Style Hamburger */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      z-index: 2100;
    }

    .hamburger span {
      display: block;
      width: 30px;
      height: 3px;
      background: white;
      border-radius: 2px;
      transition: 0.3s;
    }

    /* ===== ANIMATION DE FONDU (REVEAL) ===== */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1s ease-out, transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.1);
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== MAIN CONTENT ===== */
    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 120px);
      padding: 40px 20px;
      gap: 20px;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    /* ===== CARD GLASS (Effet Apple) ===== */
    .contact-card {
      display: flex;
      align-items: center;
      gap: 20px;
      width: 400px;
      max-width: 95% ;
      padding: 1.2rem 2rem;
      text-decoration: none;
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), 
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: transform 0.35s ease, background 0.35s ease, border-color 0.35s ease;
    }

    .contact-card:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-5px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .contact-card img {
      height: 40px;
      width: 40px;
      object-fit: contain;
    }

    .contact-card span {
      font-weight: 500;
      font-size: 1.2rem;
      word-break: break-all;
    }

    /* ===== RESPONSIVE MOBILE / TABLETTE ===== */
    @media (max-width: 950px) {
      header { 
        padding: 10px 20px; 
        height: 70px; 
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .header-left img { 
        width: 50px !important; 
        height: auto;
      }

      .header-center { 
        position: absolute; 
        left: 50%; 
        top: 50%;
        transform: translate(-50%, -50%); 
        width: auto;
        z-index: 5;
      }

      .header-center .logo-typo { 
        font-size: 1.8rem; 
        white-space: nowrap;
      }

      .hamburger { 
        display: flex; 
        position: relative;
        z-index: 2100;
      }

      .nav {
        position: fixed;
        top: 0;
        right: -100%;
        width: 100%;
        height: 100vh;
        background: rgba(17, 17, 17, 0.98);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 30px;
        transition: 0.5s cubic-bezier(0.77, 0.2, 0.05, 1.0);
        z-index: 2000;
      }

      .nav.open { right: 0; }
      .nav a { font-size: 2rem; opacity: 0.8; }
      .nav a.active::after { bottom: -10px; height: 4px; }

      .hamburger.active span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
      .hamburger.active span:nth-child(2) { opacity: 0; }
      .hamburger.active span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

      main { padding: 80px 15px 40px; }
      h1 { font-size: 2.2rem; margin-bottom: 1.5rem; }
      .contact-card { width: 100%; }
    }

    @media (max-width: 400px) {
      .header-left { display: none; } 
      .header-center .logo-typo { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <img src="logo.png" alt="Logo">
    </div>

    <div class="header-center">
      <div class="logo-typo">InspiGraphie</div>
    </div>

    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <nav class="nav" id="nav-menu">
      <a href="index.html">Accueil</a>
      <a href="projets.html">Projets</a>
      <a href="competences.html">Compétences</a>
      <a href="apropos.html">À propos</a>
      <a href="services.html">Services</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main>
    <h1 class="reveal">Contactez-moi</h1>

    <a href="https://www.instagram.com/inspi_graphie/" target="_blank" class="contact-card reveal">
      <img src="instagram.png" alt="Instagram">
      <span>@inspi_graphie</span>
    </a>

    <a href="https://www.tiktok.com/@inspi_graphie" target="_blank" class="contact-card reveal">
      <img src="tiktok.png" alt="TikTok">
      <span>@inspi_graphie</span>
    </a>

    <a href="https://x.com/InspiGraphie" target="_blank" class="contact-card reveal">
      <img src="x.png" alt="Twitter">
      <span>@InspiGraphie</span>
    </a>

    <a href="https://www.linkedin.com/in/c%C3%A9lian-seguin-gosselin-1172b1390/?skipRedirect=true" target="_blank" class="contact-card reveal">
      <img src="linkedin.png" alt="LinkedIn">
      <span>Célian SEGUIN GOSSELIN</span>
    </a>

    <a href="mailto:inspigraphie@gmail.com" class="contact-card reveal">
      <img src="mail.png" alt="Email">
      <span>celianseguingosselin.laf@gmail.com</span>
    </a>
  </main>

  <script>
    // --- GESTION DU MENU HAMBURGER ---
    const hamburger = document.getElementById('hamburger');
    const navMenu = document.getElementById('nav-menu');

    hamburger.addEventListener('click', () => {
        hamburger.classList.toggle('active');
        navMenu.classList.toggle('open');
        document.body.style.overflow = navMenu.classList.contains('open') ? 'hidden' : 'auto';
    });

    document.querySelectorAll('.nav a').forEach(link => {
        link.addEventListener('click', () => {
            hamburger.classList.remove('active');
            navMenu.classList.remove('open');
            document.body.style.overflow = 'auto';
        });
    });

    // --- ANIMATION REVEAL AU SCROLL (FONDU CASCADE) ---
    const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry, index) => {
            if (entry.isIntersecting) {
                setTimeout(() => {
                    entry.target.classList.add('active');
                }, index * 150);
                revealObserver.unobserve(entry.target);
            }
        });
    }, { threshold: 0.1 });

    document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
  </script>

</body>
</html>
